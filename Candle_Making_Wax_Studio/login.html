<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUME — Log In</title>
  <meta name="description" content="Log in to your LUME account.">
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="auth-page">
  <div class="auth-layout">
    <!-- Image Side -->
    <div class="auth-image">
      <img src="assets/images/heroes/hero-custom.png" alt="Lit candles on a table" loading="eager">
      <div class="auth-image__overlay"></div>
      <a href="index.html" class="auth-logo">
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none"><path d="M24 4C24 4 12 18 12 28C12 34.627 17.373 40 24 40C30.627 40 36 34.627 36 28C36 18 24 4 24 4Z" fill="#C97B3D" opacity="0.85"/><path d="M24 16C24 16 18 24 18 30C18 33.314 20.686 36 24 36C27.314 36 30 33.314 30 30C30 24 24 16 24 16Z" fill="#E8A84C"/><path d="M24 24C24 24 21 28 21 31C21 32.657 22.343 34 24 34C25.657 34 27 32.657 27 31C27 28 24 24 24 24Z" fill="#FAF4EB"/></svg>
      </a>
      <div class="auth-quote">
        "A candle loses nothing by lighting another candle."
      </div>
    </div>
    
    <!-- Form Side -->
    <div class="auth-panel-wrap">
      <div class="auth-panel">
        <h1 class="auth-panel__title">Welcome Back</h1>
        <p class="auth-panel__subtitle">Enter your details to access your account.</p>
        
        <form data-validate class="auth-form" action="user-dashboard.html" method="GET">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" placeholder="hello@example.com" required>
            <span class="form-error">Please enter a valid email.</span>
          </div>
          
          <div class="form-group">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <label class="form-label">Password</label>
              <a href="#" style="font-size:var(--caption-size);color:var(--color-primary);">Forgot password?</a>
            </div>
            <div class="password-input-wrap">
              <input type="password" class="form-input password-input" placeholder="••••••••" required>
              <button type="button" class="password-toggle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <span class="form-error">Please enter your password.</span>
          </div>
          
          <div class="form-group">
            <label style="display:flex;align-items:center;gap:8px;font-size:var(--small-size);cursor:pointer;">
              <input type="checkbox"> Remember me for 30 days
            </label>
          </div>
          
          <button type="submit" class="btn btn--primary btn--full">Log In</button>
        </form>
        
        <div class="auth-divider"><span>or log in with</span></div>
        
        <div class="auth-social">
          <button class="btn btn--outline auth-social-btn">
            <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Google
          </button>
        </div>
        
        <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
      </div>
    </div>
  </div>

  <script src="assets/js/forms.js"></script>
</body>
</html>
