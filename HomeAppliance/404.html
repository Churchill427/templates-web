<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found | Fixa</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body style="overflow: hidden; height: 100vh;">

  <div class="fullscreen-center" style="background: var(--bg-main);">
    <div style="max-width: 500px; padding: 2rem;">
      
      <!-- Custom SVG Broken Appliance Graphic -->
      <svg width="180" height="180" viewBox="0 0 200 200" fill="none" style="margin: 0 auto 1.5rem auto; display: block;">
        <!-- Toaster / Appliance Outline -->
        <rect x="30" y="70" width="140" height="100" rx="20" fill="var(--bg-surface)" stroke="var(--color-primary)" stroke-width="6"/>
        <path d="M50 70 V40 C50 30 150 30 150 40 V70" stroke="var(--color-secondary)" stroke-width="6" stroke-dasharray="8 8"/>
        <!-- Toast / Appliance Top -->
        <rect x="70" y="25" width="60" height="40" rx="6" fill="var(--color-secondary)"/>
        <!-- Broken Spark / Gear SVG -->
        <path d="M100 110 L110 130 L90 135 L105 155" stroke="#EF4444" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="60" cy="120" r="10" stroke="var(--text-muted)" stroke-width="4" stroke-dasharray="4 4"/>
        <circle cx="140" cy="130" r="14" stroke="var(--color-primary)" stroke-width="4" stroke-dasharray="6 6"/>
      </svg>

      <span class="badge" style="background: #EF4444; color: #FFF; margin-bottom: 0.5rem;">ERROR 404</span>
      <h1 style="font-size: clamp(1.75rem, 4vw, 2.75rem); margin-bottom: 0.75rem;">Page Not Found</h1>
      <p style="margin-bottom: 2rem; color: var(--text-muted);">The appliance page or service resource you are looking for has been unplugged or moved to another URL.</p>

      <div style="display:flex; gap: 1rem; justify-content: center;">
        <a href="index.html" class="btn btn-primary">Back to Home 1</a>
        <a href="appliances.html" class="btn btn-outline">Browse Catalog</a>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
