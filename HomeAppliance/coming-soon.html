<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something Amazing is Coming | Fixa Smart Ecosystem</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body style="overflow-x: hidden;">

  <div class="coming-soon-hero">
    <div style="max-width: 760px; padding: 2rem;">
      <a href="index.html" class="logo" style="justify-content: center; color: #FFFFFF; font-size: 2rem; margin-bottom: 1.5rem;">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 44px; height: 44px; color: var(--color-secondary);">
          <path d="M3.5 10.5L12 3L20.5 10.5V19.5C20.5 20.3284 19.8284 21 19 21H5C4.17157 21 3.5 20.3284 3.5 19.5V10.5Z" />
          <circle cx="12" cy="13.5" r="4" />
          <path d="M7.5 9L9.5 11" />
          <path d="M16.5 18L14.5 16" />
          <path d="M12.5 11.5L10.5 14H13.5L11.5 16.5" fill="var(--color-secondary)" stroke="var(--color-secondary)" stroke-width="0.5" />
        </svg>
        FIXA<span>.</span>
      </a>

      <span class="badge" style="background: var(--color-secondary); color: #0F172A; font-weight: 700; margin-bottom: 1rem; padding: 4px 14px; font-size: 0.85rem;">NEXT-GEN APPLIANCE HUB</span>
      
      <h1 style="color: #FFFFFF; text-shadow: 0 4px 20px rgba(0,0,0,0.5); margin-bottom: 1rem;">Something Amazing is Coming</h1>
      <p style="color: #E2E8F0; font-size: 1.15rem; margin-bottom: 2rem;">We are launching our revolutionary AI-powered smart appliance diagnostic platform. Stay tuned!</p>

      <!-- Live JS Countdown Timer -->
      <div class="timer-grid">
        <div class="timer-box">
          <div id="timer-days" class="timer-val">30</div>
          <div class="timer-lbl">Days</div>
        </div>
        <div class="timer-box">
          <div id="timer-hours" class="timer-val">12</div>
          <div class="timer-lbl">Hours</div>
        </div>
        <div class="timer-box">
          <div id="timer-mins" class="timer-val">45</div>
          <div class="timer-lbl">Mins</div>
        </div>
        <div class="timer-box">
          <div id="timer-secs" class="timer-val">00</div>
          <div class="timer-lbl">Secs</div>
        </div>
      </div>

      <!-- Email Notification Form -->
      <form id="notify-form" style="display: flex; gap: 0.5rem; justify-content: center; max-width: 480px; margin: 0 auto 2.5rem auto; flex-wrap: wrap;">
        <input type="email" placeholder="Enter your email address" class="form-input" style="flex: 1; min-width: 240px; background: rgba(255,255,255,0.95); color: #1E293B; height: 48px; border-radius: 8px;" required>
        <button type="submit" class="btn btn-secondary" style="height: 48px; padding: 0 1.5rem;">Notify Me</button>
      </form>

      <!-- Social & Navigation Links -->
      <div style="display: flex; gap: 1.5rem; justify-content: center; align-items: center; flex-wrap: wrap;">
        <a href="index.html" class="btn btn-outline" style="color: #FFFFFF; border-color: rgba(255,255,255,0.4);">Enter Home 1 Store</a>
        <a href="appliances.html" class="btn btn-outline" style="color: #FFFFFF; border-color: rgba(255,255,255,0.4);">Browse Catalog</a>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/countdown.js"></script>
</body>
</html>
