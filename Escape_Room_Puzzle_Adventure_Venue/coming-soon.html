<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYST — Coming Soon | New Room Under Construction</title>
  <meta name="description" content="A new escape room is being built at MYST. Sign up to be notified when it launches.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230C1222'/%3E%3Cpath d='M6 24V8l5 10 5-10 5 10 5-10v16' stroke='%23F2A33C' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='20' r='3' fill='none' stroke='%23F2A33C' stroke-width='1.5'/%3E%3Cline x1='16' y1='23' x2='16' y2='26' stroke='%23F2A33C' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="stylesheet" href="css/rtl.css">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body>
  <!-- Minimal top bar -->
  <div class="error-page__bar">
    <a href="index.html" style="font-family:var(--font-display);font-size:1.5rem;font-weight:900;color:var(--white);letter-spacing:0.08em;text-decoration:none;">MYST</a>
    <div style="display:flex;align-items:center;gap:var(--space-3);">
      <button class="rtl-toggle" style="color:var(--text-on-dark-secondary);border-color:rgba(255,255,255,0.2);" aria-label="Toggle text direction">LTR</button>
      <button class="theme-toggle" aria-label="Toggle theme" style="color:var(--text-on-dark-secondary);"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
    </div>
  </div>

  <div class="error-page">
    <div class="error-page__bg"><img src="images/hero-coming-soon.jpg" alt="Atmospheric underground chamber excavation scene with scaffolding and blueprint plans"></div>
    <div class="error-page__overlay"></div>
    <div class="error-page__content">
      <h1 style="color:var(--white);margin-bottom:var(--space-4);">New Room Under Construction</h1>
      <p style="color:var(--text-on-dark-secondary);max-width:480px;margin:0 auto var(--space-8);">Our puzzle architects are building something extraordinary. Be the first to know when it opens.</p>

      <!-- Countdown -->
      <div class="countdown" data-countdown="2027-01-15T18:00:00">
        <div class="countdown__item"><span class="countdown__number" data-cd-days>00</span><span class="countdown__label">Days</span></div>
        <div class="countdown__item"><span class="countdown__number" data-cd-hours>00</span><span class="countdown__label">Hours</span></div>
        <div class="countdown__item"><span class="countdown__number" data-cd-mins>00</span><span class="countdown__label">Minutes</span></div>
        <div class="countdown__item"><span class="countdown__number" data-cd-secs>00</span><span class="countdown__label">Seconds</span></div>
      </div>

      <!-- Email Notify -->
      <form data-validate style="display:flex;gap:var(--space-3);max-width:400px;margin:0 auto;flex-wrap:wrap;justify-content:center;">
        <div class="form-group" style="flex:1;min-width:200px;margin-bottom:0;">
          <input type="email" class="form-input" placeholder="Enter your email for updates" required style="background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);color:var(--white);">
          <span class="form-error" style="color:#ff6b6b;">Please enter a valid email</span>
        </div>
        <button type="submit" class="btn btn-primary">Notify Me</button>
      </form>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
