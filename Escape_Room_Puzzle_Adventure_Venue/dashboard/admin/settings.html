    <main class="dashboard__main">
      <header class="topbar"><div class="topbar__left"><button class="sidebar__toggle topbar__menu-btn" aria-label="Toggle sidebar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button><h1 class="topbar__title">Settings</h1></div><div class="topbar__right"><button class="rtl-toggle">LTR</button><button class="theme-toggle" aria-label="Toggle theme"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button><div class="avatar-menu"><button class="avatar-menu__btn" aria-label="User menu"><img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?w=80&q=80" alt="Admin" class="avatar-menu__img"></button></div></div></header>
      <div class="dashboard__content" style="max-width:700px;">
        <!-- Profile Settings -->
        <div class="dashboard-card" style="margin-bottom:var(--space-8);">
          <div class="dashboard-card__header"><h3 style="font-size:1rem;">Profile Settings</h3></div>
          <form data-validate>
            <div style="display:flex;align-items:center;gap:var(--space-6);margin-bottom:var(--space-6);">
              <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?w=100&q=80" alt="Profile photo" style="width:72px;height:72px;border-radius:50%;object-fit:cover;">
              <div><button type="button" class="btn btn-secondary btn-sm">Change Photo</button><div style="font-size:var(--xs-size);color:var(--text-tertiary);margin-top:var(--space-1);">JPG or PNG, max 2MB</div></div>
            </div>
            <div class="form-group"><label class="form-label">Full Name</label><input type="text" class="form-input" value="Marcus Hale"></div>
            <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" value="marcus@myst.com"></div>
            <div class="form-group"><label class="form-label">Phone</label><input type="tel" class="form-input" value="+1 (555) 697-8000"></div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </form>
        </div>
        <!-- Venue Settings -->
        <div class="dashboard-card" style="margin-bottom:var(--space-8);">
          <div class="dashboard-card__header"><h3 style="font-size:1rem;">Venue Settings</h3></div>
          <form>
            <div class="form-group"><label class="form-label">Venue Name</label><input type="text" class="form-input" value="MYST" readonly></div>
            <div class="form-group"><label class="form-label">Address</label><input type="text" class="form-input" value="42 Enigma Lane, Crestwood, CA 90210"></div>
            <div class="form-group"><label class="form-label">Contact Email</label><input type="email" class="form-input" value="hello@myst.example.com"></div>
            <div class="form-group"><label class="form-label">Default Currency</label><select class="form-input form-select"><option selected>USD ($)</option><option>EUR</option><option>GBP</option></select></div>
            <button type="submit" class="btn btn-primary">Update Venue</button>
          </form>
        </div>
        <!-- Security -->
        <div class="dashboard-card">
          <div class="dashboard-card__header"><h3 style="font-size:1rem;">Security</h3></div>
          <form data-validate>
            <div class="form-group"><label class="form-label">Current Password</label><input type="password" class="form-input" placeholder="Enter current password" required></div>
            <div class="form-group"><label class="form-label">New Password</label><div class="password-wrapper"><input type="password" class="form-input" placeholder="Enter new password" data-min-length="8"><button type="button" class="password-toggle" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
            <button type="submit" class="btn btn-primary">Change Password</button>
          </form>
        </div>
      </div>
    </main>
  </div>
