<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mystGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCD75"/>
      <stop offset="45%" stop-color="#F2A33C"/>
      <stop offset="100%" stop-color="#C87214"/>
    </linearGradient>
    <linearGradient id="mystBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18233C"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>
    <linearGradient id="mystGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFCD75" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F2A33C" stop-opacity="0"/>
    </linearGradient>
    <filter id="vaultShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Vault Hexagonal / Squircle Badge -->
  <rect x="3" y="3" width="42" height="42" rx="10" fill="url(#mystBg)" stroke="url(#mystGold)" stroke-width="2" filter="url(#vaultShadow)"/>
  
  <!-- Subtle Corner Rivets -->
  <circle cx="8" cy="8" r="1.2" fill="#F2A33C" opacity="0.7"/>
  <circle cx="40" cy="8" r="1.2" fill="#F2A33C" opacity="0.7"/>
  <circle cx="8" cy="40" r="1.2" fill="#F2A33C" opacity="0.7"/>
  <circle cx="40" cy="40" r="1.2" fill="#F2A33C" opacity="0.7"/>

  <!-- Geometric Architectural "M" Monogram -->
  <!-- Left Leg -->
  <path d="M10 36V13L16 19V36H10Z" fill="url(#mystGold)"/>
  <!-- Right Leg -->
  <path d="M38 36V13L32 19V36H38Z" fill="url(#mystGold)"/>
  <!-- Central Chevron / Peaks of M -->
  <path d="M16 19L24 11L32 19L28 22.5L24 18.5L20 22.5L16 19Z" fill="url(#mystGold)"/>

  <!-- Mystic Glowing Keyhole in Heart of M -->
  <!-- Keyhole Backplate -->
  <rect x="20" y="21" width="8" height="14" rx="4" fill="#0A0E1A" stroke="url(#mystGold)" stroke-width="1.2"/>
  <!-- Keyhole Opening -->
  <circle cx="24" cy="25" r="2.2" fill="url(#mystGold)"/>
  <path d="M22.8 25.5L22 32H26L25.2 25.5Z" fill="url(#mystGold)"/>
  <!-- Central Light Gleam -->
  <circle cx="24" cy="25" r="1" fill="#FFF8E7"/>
</svg>