<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYST — Reset Your Password</title>
  <meta name="description" content="Reset your MYST account password. Enter your email to receive a secure password reset link.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230C1222'/%3E%3Cpath d='M6 24V8l5 10 5-10 5 10 5-10v16' stroke='%23F2A33C' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='20' r='3' fill='none' stroke='%23F2A33C' stroke-width='1.5'/%3E%3Cline x1='16' y1='23' x2='16' y2='26' stroke='%23F2A33C' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="stylesheet" href="css/rtl.css">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
</head>
<body>
  <div class="auth-page--centered">
    <div class="hero__bg" style="position:absolute;inset:0;z-index:0;">
      <img src="images/hero-forgot.jpg" alt="Mysterious ancient stone labyrinth corridor with glowing amber lanterns" style="width:100%;height:100%;object-fit:cover;">
    </div>
    <div style="position:absolute;inset:0;background:rgba(12,18,34,0.75);z-index:1;"></div>
    <div class="auth-card" style="position:relative;z-index:2;background:var(--bg-secondary);padding:var(--space-10);border-radius:var(--border-radius-xl);box-shadow:var(--shadow-xl);max-width:420px;width:100%;">
      <div style="position:absolute;top:var(--space-4);right:var(--space-4);display:flex;gap:var(--space-2);">
        <button class="rtl-toggle" aria-label="Toggle text direction">LTR</button>
        <button class="theme-toggle" aria-label="Toggle theme"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      </div>
      <div class="auth-card__header">
        <a href="index.html" class="auth-card__logo"><img src="images/logo.svg" alt="" class="auth-card__logo-img" width="36" height="36"><span>MYST</span></a>
        <h1 class="auth-card__title" style="font-size:var(--h3-size);">Reset Password</h1>
        <p class="auth-card__subtitle">Enter your email and we'll send you a reset link</p>
      </div>
      <form data-validate>
        <div class="form-group">
          <label class="form-label" for="reset-email">Email Address</label>
          <input type="email" id="reset-email" class="form-input" placeholder="you@example.com" required>
          <span class="form-error">Please enter a valid email address</span>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">Send Reset Link</button>
      </form>
      <div class="auth-footer" style="margin-top:var(--space-6);">
        <a href="login.html" style="font-weight:var(--font-weight-semibold);">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:4px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to Sign In
        </a>
      </div>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
