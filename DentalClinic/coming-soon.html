  <section class="hero" style="min-height: calc(100vh - 72px); padding-top: 72px; display: flex; align-items: center; justify-content: center; text-align: center;">

    <div class="hero__overlay"></div>
    <div class="hero__content" style="max-width: 600px; padding: var(--space-2xl);">
      <div class="reveal" style="font-size: 64px; color: var(--color-accent); margin-bottom: var(--space-md);"><i class="fa-solid fa-rocket"></i></div>

      <form class="newsletter__form reveal reveal-delay-3" data-validate style="margin: 0 auto; max-width: 400px;">
