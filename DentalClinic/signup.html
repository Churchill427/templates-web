<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create an account with DENT Dental Clinic to manage your appointments, view treatment history, and access exclusive resources.">
  <title>Sign Up — DENT</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/icons/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/dark-mode.css"><link rel="stylesheet" href="assets/css/rtl.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    @media (max-width: 900px) {
      html, body { overflow: auto; height: auto; min-height: 100%; }
      .auth-page { height: auto; min-height: 100vh; }
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <!-- Left: Brand Showcase -->
    <div class="auth-page__showcase">
      <div class="auth-page__showcase-bg"><img src="assets/images/heroes/hero-home-b.png" alt="DENT clinic background" loading="eager"></div>
      <a href="index.html" style="text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:var(--space-lg);">
        <img src="assets/images/icons/logo.svg" alt="DENT Logo" width="80" height="80">
        <span style="font-family:var(--font-heading);font-size:42px;font-weight:700;color:#FFFFFF;letter-spacing:3px;">DENT</span>
      </a>
    </div>

    <!-- Right: Signup Form -->
    <div class="auth-page__form-side">
      <div class="auth-card" style="padding:var(--space-xl); max-height:100vh; overflow-y:auto; width: 100%; max-width: 500px; margin: auto;">
        <div class="auth-card__brand">
          <div class="auth-card__brand-logo"><img src="assets/images/icons/logo.svg" alt="DENT Logo" width="40" height="40"></div>
          <span class="auth-card__brand-name">DENT</span>
        </div>
        <h2>Create an Account</h2>
        <p class="auth-subtitle">Join us to manage your dental care effortlessly.</p>

        <!-- Social Logins -->
        <div class="social-buttons">
          <button class="btn btn--social btn--google">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Sign up with Google
          </button>
        </div>

        <div class="auth-card__divider"><span>or sign up with email</span></div>

        <form data-validate id="signupForm">
          <div class="form-grid">
            <div class="form-group"><label for="signup-fname">First Name</label><input type="text" id="signup-fname" name="fname" class="form-control" placeholder="John" required></div>
            <div class="form-group"><label for="signup-lname">Last Name</label><input type="text" id="signup-lname" name="lname" class="form-control" placeholder="Doe" required></div>
          </div>
          <div class="form-group"><label for="signup-email">Email Address</label><input type="email" id="signup-email" name="email" class="form-control" placeholder="john@example.com" required></div>
          <div class="form-group"><label for="signup-password">Password</label><input type="password" id="signup-password" name="password" class="form-control" placeholder="Create a password" required></div>
          <div class="form-group"><div class="form-check"><input type="checkbox" id="terms" required><label for="terms" style="margin-bottom:0;">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label></div></div>
          <button type="submit" class="btn btn--primary btn--full btn--lg">Create Account</button>
        </form>

        <div class="auth-card__footer">
          <p>Already have an account? <a href="login.html">Sign In</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
