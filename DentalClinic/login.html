<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your DENT Dental Clinic account to manage appointments and view your treatment history.">
  <title>Sign In — DENT</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/icons/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/dark-mode.css"><link rel="stylesheet" href="assets/css/rtl.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
  </style>
</head>
<body>
  <div class="auth-page">
    <!-- Left: Brand Showcase -->
    <div class="auth-page__showcase">
      <div class="auth-page__showcase-bg"><img src="assets/images/heroes/hero-home-a.png" alt="DENT clinic background" loading="eager"></div>
      <a href="index.html" style="text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:var(--space-lg);">
        <img src="assets/images/icons/logo.svg" alt="DENT Logo" width="80" height="80">
        <span style="font-family:var(--font-heading);font-size:42px;font-weight:700;color:#FFFFFF;letter-spacing:3px;">DENT</span>
      </a>
    </div>

    <!-- Right: Login Form -->
    <div class="auth-page__form-side">
      <div class="auth-card">
        <div class="auth-card__brand">
          <div class="auth-card__brand-logo"><img src="assets/images/icons/logo.svg" alt="DENT Logo" width="40" height="40"></div>
          <span class="auth-card__brand-name">DENT</span>
        </div>
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Sign in to manage your appointments and dental care.</p>

        <!-- Social Logins -->
        <div class="social-buttons">
          <button class="btn btn--social btn--google">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Continue with Google
          </button>
          <button class="btn btn--social btn--facebook"><i class="fa-brands fa-facebook-f" style="font-size:18px;"></i> Continue with Facebook</button>
          <button class="btn btn--social btn--apple"><i class="fa-brands fa-apple" style="font-size:20px;"></i> Continue with Apple</button>
        </div>

        <div class="auth-card__divider"><span>or sign in with email</span></div>

        <form data-validate id="loginForm">
          <div class="form-group"><label for="login-email">Email Address</label><input type="email" id="login-email" name="email" class="form-control" placeholder="john@example.com" required></div>
          <div class="form-group"><label for="login-password">Password</label><input type="password" id="login-password" name="password" class="form-control" placeholder="Enter your password" required></div>
          <div class="form-group"><div class="form-check"><input type="checkbox" id="remember-me"><label for="remember-me" style="margin-bottom:0;">Remember me</label></div></div>
          <button type="submit" class="btn btn--primary btn--full btn--lg">Sign In</button>
        </form>

        <div class="auth-card__footer">
          <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
