<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SOLE - Logo Redesign Preview</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/icons/favicon.svg">
  <link rel="stylesheet" href="assets/css/main.css">
  <style>
    body { background: #0f172a; color: #fff; padding: 40px; font-family: 'Inter', sans-serif; }
    .card { background: #1e293b; border-radius: 12px; padding: 30px; margin-bottom: 24px; border: 1px solid #334155; }
    h2 { margin-bottom: 20px; color: #f8fafc; font-size: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .flex-row { display: flex; align-items: center; gap: 40px; }
    .logo-sample { display: flex; align-items: center; gap: 12px; padding: 16px 24px; background: #0f172a; border-radius: 10px; }
    .logo-sample.light { background: #ffffff; color: #1a1a2e; }
    .tag { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>SOLE Logo Redesign Preview</h1>
  
  <div class="card">
    <h2>1. Header / Navbar Logo (Light Theme & Dark Theme)</h2>
    <div class="flex-row">
      <div>
        <div class="tag">Light Navbar</div>
        <div class="logo-sample light">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="soleBg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#dc2626"/>
                <stop offset="40%" stop-color="#c41e3a"/>
                <stop offset="100%" stop-color="#7f1d1d"/>
              </linearGradient>
              <linearGradient id="soleGold" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#fff066"/>
                <stop offset="50%" stop-color="#ffd700"/>
                <stop offset="100%" stop-color="#d97706"/>
              </linearGradient>
            </defs>
            <rect width="36" height="36" rx="9" fill="url(#soleBg)"/>
            <rect x="1" y="1" width="34" height="34" rx="8" fill="none" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
            <path d="M8 22C8 17.5 11.5 14.2 15.5 14.2C18 14.2 20 15.3 22 16.2C24 17 26 15.8 27.5 14.5C27.9 14.2 28.4 14.5 28.2 15C27 18 23.8 20 20.2 19.6C17.8 19.3 15.8 18 13.8 18 C11.2 18 9.5 19.8 9 22.2C8.9 22.6 8 22.5 8 22Z" fill="white"/>
            <path d="M6.8 24.8C10.2 24.8 13.6 26 17.6 24.5C21.6 23 25 21 29 19.8C29.7 19.6 30 20.7 29 21.3C24.5 24.3 19 27 13 27C9 27 6.8 26 6.8 24.8Z" fill="white"/>
            <path d="M12 12C15.5 10.2 20 10.8 24 12.5C24.7 12.8 24.3 13.8 23.5 13.5C20 12.3 16 12 12.5 13.2C11.9 13.4 11.4 12.3 12 12Z" fill="url(#soleGold)"/>
            <path d="M26 8.5 L26.7 10.3 L28.5 11 L26.7 11.7 L26 13.5 L25.3 11.7 L23.5 11 L25.3 10.3 Z" fill="url(#soleGold)"/>
          </svg>
          <span style="font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; color: #1a1a2e; letter-spacing: 2px;">SOLE</span>
        </div>
      </div>

      <div>
        <div class="tag">Dark Navbar / Footer</div>
        <div class="logo-sample">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <use href="#soleBg"/>
            <rect width="36" height="36" rx="9" fill="url(#soleBg)"/>
            <rect x="1" y="1" width="34" height="34" rx="8" fill="none" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
            <path d="M8 22C8 17.5 11.5 14.2 15.5 14.2C18 14.2 20 15.3 22 16.2C24 17 26 15.8 27.5 14.5C27.9 14.2 28.4 14.5 28.2 15C27 18 23.8 20 20.2 19.6C17.8 19.3 15.8 18 13.8 18 C11.2 18 9.5 19.8 9 22.2C8.9 22.6 8 22.5 8 22Z" fill="white"/>
            <path d="M6.8 24.8C10.2 24.8 13.6 26 17.6 24.5C21.6 23 25 21 29 19.8C29.7 19.6 30 20.7 29 21.3C24.5 24.3 19 27 13 27C9 27 6.8 26 6.8 24.8Z" fill="white"/>
            <path d="M12 12C15.5 10.2 20 10.8 24 12.5C24.7 12.8 24.3 13.8 23.5 13.5C20 12.3 16 12 12.5 13.2C11.9 13.4 11.4 12.3 12 12Z" fill="url(#soleGold)"/>
            <path d="M26 8.5 L26.7 10.3 L28.5 11 L26.7 11.7 L26 13.5 L25.3 11.7 L23.5 11 L25.3 10.3 Z" fill="url(#soleGold)"/>
          </svg>
          <span style="font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; color: #ffffff; letter-spacing: 2px;">SOLE</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>2. Favicon Preview</h2>
    <div class="flex-row">
      <div>
        <div class="tag">SVG Favicon</div>
        <img src="assets/images/icons/favicon.svg" width="32" height="32" alt="Favicon SVG">
        <img src="assets/images/icons/favicon.svg" width="64" height="64" alt="Favicon SVG 64">
      </div>
      <div>
        <div class="tag">PNG Favicon</div>
        <img src="assets/images/icons/favicon.png" width="32" height="32" alt="Favicon PNG">
        <img src="assets/images/icons/favicon-64.png" width="64" height="64" alt="Favicon PNG 64">
      </div>
    </div>
  </div>
</body>
</html>
