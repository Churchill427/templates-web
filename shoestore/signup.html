<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a premium member account with SOLE. Get access to member perks, order tracking, and custom sizing recomendations.">
  <title>Create Your Account — SOLE</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/icons/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    body {
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--light-bg), #eaeaea);
    }
    html.dark-mode body {
      background: linear-gradient(135deg, var(--dark-bg), #080815);
    }
    .auth-toggles {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    .auth-card {
      max-height: 90vh;
      overflow-y: auto;
      /* custom scrollbar for card to prevent breaking layout */
      scrollbar-width: thin;
      padding: 30px;
    }
    .auth-card::-webkit-scrollbar {
      width: 4px;
    }
    .auth-card::-webkit-scrollbar-thumb {
      background: rgba(196,30,58,0.2);
      border-radius: 4px;
    }
    .social-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .social-login-btn {
      margin-bottom: 0;
      font-size: 12px;
      padding: 8px 12px;
      min-height: 38px;
    }
  </style>
</head>
<body>

  <!-- Absolute toggles -->
  <div class="auth-toggles">
    <button class="theme-toggle" id="themeToggle">Dark</button>
    <button class="rtl-toggle" id="rtlToggle">LTR</button>
  </div>

  <!-- Centered auth card -->
  <div class="auth-card reveal-scale revealed">
    <a href="index.html" class="auth-logo" aria-label="Go to homepage">
      <svg width="40" height="40" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="soleBgGrad_signup_html_1" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="40%" stop-color="#c41e3a"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="soleGoldGrad_signup_html_1" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff066"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="36" height="36" rx="9" fill="url(#soleBgGrad_signup_html_1)"/>
  <rect x="1" y="1" width="34" height="34" rx="8" fill="none" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <path d="M8 22C8 17.5 11.5 14.2 15.5 14.2C18 14.2 20 15.3 22 16.2C24 17 26 15.8 27.5 14.5C27.9 14.2 28.4 14.5 28.2 15C27 18 23.8 20 20.2 19.6C17.8 19.3 15.8 18 13.8 18C11.2 18 9.5 19.8 9 22.2C8.9 22.6 8 22.5 8 22Z" fill="white"/>
  <path d="M6.8 24.8C10.2 24.8 13.6 26 17.6 24.5C21.6 23 25 21 29 19.8C29.7 19.6 30 20.7 29 21.3C24.3 24.3 19 27 13 27C9 27 6.8 26 6.8 24.8Z" fill="white"/>
  <path d="M12 12C15.5 10.2 20 10.8 24 12.5C24.7 12.8 24.3 13.8 23.5 13.5C20 12.3 16 12 12.5 13.2C11.9 13.4 11.4 12.3 12 12Z" fill="url(#soleGoldGrad_signup_html_1)"/>
  <path d="M26 8.5L26.7 10.3L28.5 11L26.7 11.7L26 13.5L25.3 11.7L23.5 11L25.3 10.3Z" fill="url(#soleGoldGrad_signup_html_1)"/>
</svg>
      <span class="auth-logo-text">SOLE</span>
    </a>

    <h2>Create Your Account</h2>

    <!-- Social Row -->
    <div class="social-row">
      <button class="social-login-btn google" onclick="showToast('Connecting with Google...')">
        <i class="fa-brands fa-google"></i> Google
      </button>
      <button class="social-login-btn facebook" onclick="showToast('Connecting with Facebook...')">
        <i class="fa-brands fa-facebook-f"></i> Facebook
      </button>
      <button class="social-login-btn apple" onclick="showToast('Connecting with Apple...')">
        <i class="fa-brands fa-apple"></i> Apple
      </button>
      <button class="social-login-btn twitter" onclick="showToast('Connecting with X...')">
        <i class="fa-brands fa-x-twitter"></i> X
      </button>
    </div>

    <div class="auth-divider">
      <span>OR</span>
    </div>

    <!-- Signup Form -->
    <form id="signupForm" onsubmit="return false;">
      <div class="form-group mb-sm">
        <label class="form-label" for="fullName">Full Name *</label>
        <input type="text" id="fullName" class="form-input" required placeholder="John Doe" style="padding: 10px 14px; min-height: 38px;">
        <span class="form-error">This field is required</span>
      </div>
      <div class="form-group mb-sm">
        <label class="form-label" for="email">Email Address *</label>
        <input type="email" id="email" class="form-input" required placeholder="john@example.com" style="padding: 10px 14px; min-height: 38px;">
        <span class="form-error">Please enter a valid email address</span>
      </div>
      <div class="form-group mb-sm">
        <label class="form-label" for="phone">Phone Number</label>
        <input type="tel" id="phone" class="form-input" placeholder="+1 (555) 000-0000" style="padding: 10px 14px; min-height: 38px;">
        <span class="form-error">Please enter a valid phone number</span>
      </div>
      <div class="form-group mb-sm">
        <label class="form-label" for="password">Password *</label>
        <div class="password-toggle">
          <input type="password" id="password" class="form-input" required data-password-strength placeholder="••••••••" style="padding: 10px 14px; min-height: 38px;">
          <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility"><i class="fa-regular fa-eye"></i></button>
        </div>
        <div class="password-strength">
          <div class="password-strength-bar"></div>
        </div>
        <div class="password-strength-text">Password strength</div>
        <span class="form-error">This field is required</span>
      </div>
      <div class="form-group mb-sm">
        <label class="form-label" for="confirmPassword">Confirm Password *</label>
        <input type="password" id="confirmPassword" class="form-input" required placeholder="••••••••" style="padding: 10px 14px; min-height: 38px;">
        <span class="form-error">Passwords do not match</span>
      </div>
      <div class="form-group mb-md checkbox-group">
        <input type="checkbox" id="agreeTerms" required>
        <label for="agreeTerms">I agree to the <a href="#" class="text-accent" style="font-weight:600;">Terms & Privacy Policy</a></label>
        <span class="form-error">You must agree to the terms</span>
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-sm">Create Account</button>
    </form>

    <div class="auth-footer">
      <p style="margin-bottom: 8px; font-size: 13px; color: #94a3b8;">&copy; 2026 SOLE. All rights reserved.</p>
      <span>Already have an account? <a href="#" onclick="showToast('Login is currently disabled.')">Sign In</a></span>
    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/js/main.js"></script>
  <script src="assets/js/animations.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/forms.js"></script>
</body>
</html>
