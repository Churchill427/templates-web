<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUDZ — Sign In</title>
  <meta name="description" content="Sign in to your SUDZ account to manage orders, track shipments, and access exclusive member benefits.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Cpath d='M 18 32 C 18 32, 8 22, 8 16 C 8 8, 18 4, 18 4 C 18 4, 28 8, 28 16 C 28 22, 18 32, 18 32 Z' fill='none' stroke='%233E5C50' stroke-width='2'/%3E%3Ccircle cx='22' cy='12' r='2.5' fill='%23C2764A'/%3E%3Ccircle cx='14' cy='20' r='1.5' fill='%23C2764A'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <style>
    body { overflow-x: hidden; min-height: 100vh; }
    .auth-suds { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .auth-page__bg-gradient { position: absolute; inset: 0; background: url('assets/images/auth_image.png') center/cover no-repeat; z-index: 0; }
    .auth-page__bg-gradient::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 70%, rgba(194,118,74,0.15) 0%, transparent 50%), radial-gradient(circle at 70% 30%, rgba(143,188,166,0.1) 0%, transparent 40%); }
  </style>
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-page__bg-gradient"></div>
    <div class="auth-suds" data-bubbles="8"></div>

    <div class="auth-card anim-fade-scale">
      <!-- Controls -->
      <div class="auth-card__controls">
        <button class="navbar__icon-btn" data-theme-toggle aria-label="Toggle theme" style="width: 32px; height: 32px;">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none; width:16px; height:16px;"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px; height:16px;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="navbar__dir-toggle" data-dir-toggle style="font-size: 0.625rem; padding: 3px 8px;">RTL</button>
      </div>

      <!-- Logo -->
      <div class="auth-card__logo">
        <a href="index.html" aria-label="SUDZ Home">
          <svg viewBox="0 0 100 36" style="height: 40px;"><path d="M 18 32 C 18 32, 8 22, 8 16 C 8 8, 18 4, 18 4 C 18 4, 28 8, 28 16 C 28 22, 18 32, 18 32 Z" fill="none" stroke="var(--clr-primary)" stroke-width="2"/><circle cx="22" cy="12" r="2.5" fill="var(--clr-secondary)"/><circle cx="14" cy="20" r="1.5" fill="var(--clr-secondary)"/><text x="36" y="25" text-anchor="start" fill="var(--clr-primary)" font-family="'Fraunces', Georgia, serif" font-weight="700" font-size="24">SUDZ</text></svg>
        </a>
      </div>

      <!-- Header -->
      <div class="auth-card__header">
        <h1>Welcome back</h1>
        <p>Sign in to continue your ritual</p>
      </div>

      <!-- Social Login -->
      <div class="auth-card__socials">
        <button class="social-btn social-btn--google" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Continue with Google
        </button>
        <button class="social-btn social-btn--facebook" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
          Continue with Facebook
        </button>
        <button class="social-btn social-btn--apple" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
          Continue with Apple
        </button>
      </div>

      <!-- Divider -->
      <div class="divider">or continue with email</div>

      <!-- Form -->
      <form data-validate id="loginForm">
        <div class="form-group form-floating">
          <input type="email" class="form-input" id="loginEmail" placeholder=" " required>
          <label for="loginEmail" class="form-label">Email address</label>
          <span class="form-error"></span>
        </div>
        <div class="form-group form-floating" style="position: relative;">
          <input type="password" class="form-input" id="loginPassword" placeholder=" " required minlength="6">
          <label for="loginPassword" class="form-label">Password</label>
          <button type="button" class="password-toggle" aria-label="Show password">
            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
          <span class="form-error"></span>
        </div>
        <div class="flex-between mb-3">
          <label class="form-check" style="font-size: var(--fs-small);">
            <input type="checkbox"> Remember me
          </label>
          <a href="#" style="font-size: var(--fs-small); color: var(--clr-accent); font-weight: var(--fw-medium);">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn--primary btn--full btn--lg">Sign In</button>
      </form>

      <div class="auth-card__footer">
        New here? <a href="signup.html">Create an account</a>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    // Demo: redirect to user dashboard on login
    document.getElementById('loginForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      if (email && email.includes('@')) {
        if (email.includes('admin')) {
          window.location.href = 'dashboard/admin.html';
        } else {
          window.location.href = 'dashboard/user.html';
        }
      }
    });
  </script>
</body>
</html>
