<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Terracotta Red Gradient -->
    <linearGradient id="terracottaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E25438" />
      <stop offset="50%" stop-color="#D7492D" />
      <stop offset="100%" stop-color="#BE381D" />
    </linearGradient>

    <!-- Cream & Soft Rose Gold Border Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9EDE7" />
      <stop offset="50%" stop-color="#E8CBBF" />
      <stop offset="100%" stop-color="#D8B5A7" />
    </linearGradient>

    <!-- Handle Color Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7CBB6" />
      <stop offset="100%" stop-color="#E3A88E" />
    </linearGradient>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#5C1609" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Ring (Cream / Rose Gold Border) -->
  <circle cx="256" cy="256" r="236" fill="url(#terracottaBg)" stroke="url(#ringGrad)" stroke-width="18" filter="url(#badgeShadow)" />
  <circle cx="256" cy="256" r="218" stroke="url(#ringGrad)" stroke-width="3" opacity="0.6" stroke-dasharray="8 6" />

  <!-- Central Emblem Group -->
  <g filter="url(#badgeShadow)">
    <!-- 1. BAKER'S CHEF HAT (Top Center) -->
    <!-- Puffy Toque Top -->
    <path d="M 186 245 C 160 245, 140 220, 150 195 C 140 170, 160 145, 190 145 C 205 125, 235 115, 256 115 C 277 115, 307 125, 322 145 C 352 145, 372 170, 362 195 C 372 220, 352 245, 326 245 Z" fill="#FFFFFF" />
    
    <!-- Hat Band Base -->
    <path d="M 186 245 L 326 245 C 330 270, 320 285, 256 285 C 192 285, 182 270, 186 245 Z" fill="#FFFFFF" />
    <!-- Hat Band Shadow Detail -->
    <path d="M 194 250 L 318 250 C 312 272, 288 280, 256 280 C 224 280, 200 272, 194 250 Z" fill="#F7CFBD" />

    <!-- 2. ROLLING PIN (Bottom Center) -->
    <!-- Main Wooden Barrel (White Body) -->
    <rect x="156" y="300" width="200" height="32" rx="6" fill="#FFFFFF" />
    
    <!-- Left Handle -->
    <path d="M 156 316 L 126 316 C 114 316, 108 308, 104 316 C 108 324, 114 316, 126 316 L 156 316" stroke="url(#handleGrad)" stroke-width="14" stroke-linecap="round" fill="none" />
    
    <!-- Right Handle -->
    <path d="M 356 316 L 386 316 C 398 316, 404 308, 408 316 C 404 324, 398 316, 386 316 L 356 316" stroke="url(#handleGrad)" stroke-width="14" stroke-linecap="round" fill="none" />

    <!-- 3. WHEAT STALKS (Left and Right Arches) -->
    <!-- Left Wheat Stalk -->
    <!-- Stem -->
    <path d="M 180 300 C 145 285, 125 250, 120 230" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Left Wheat Grains -->
    <path d="M 120 230 C 110 220, 112 205, 126 215 C 122 225, 120 230, 120 230 Z" fill="#FFFFFF" />
    <path d="M 126 242 C 110 238, 108 222, 124 228 C 124 238, 126 242, 126 242 Z" fill="url(#ringGrad)" />
    <path d="M 134 254 C 118 252, 114 236, 130 240 C 130 250, 134 254, 134 254 Z" fill="#FFFFFF" />
    <path d="M 144 265 C 128 266, 122 250, 138 252 C 140 260, 144 265, 144 265 Z" fill="url(#ringGrad)" />
    <path d="M 156 275 C 140 278, 132 262, 148 263 C 150 270, 156 275, 156 275 Z" fill="#FFFFFF" />
    <path d="M 168 285 C 152 288, 144 274, 160 273 C 162 280, 168 285, 168 285 Z" fill="url(#ringGrad)" />

    <!-- Right Wheat Stalk -->
    <!-- Stem -->
    <path d="M 332 300 C 367 285, 387 250, 392 230" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Right Wheat Grains -->
    <path d="M 392 230 C 402 220, 400 205, 386 215 C 390 225, 392 230, 392 230 Z" fill="#FFFFFF" />
    <path d="M 386 242 C 402 238, 404 222, 388 228 C 388 238, 386 242, 386 242 Z" fill="url(#ringGrad)" />
    <path d="M 378 254 C 394 252, 398 236, 382 240 C 382 250, 378 254, 378 254 Z" fill="#FFFFFF" />
    <path d="M 368 265 C 384 266, 390 250, 374 252 C 372 260, 368 265, 368 265 Z" fill="url(#ringGrad)" />
    <path d="M 356 275 C 372 278, 380 262, 364 263 C 362 270, 356 275, 356 275 Z" fill="#FFFFFF" />
    <path d="M 344 285 C 360 288, 368 274, 352 273 C 350 280, 344 285, 344 285 Z" fill="url(#ringGrad)" />
  </g>
</svg>
