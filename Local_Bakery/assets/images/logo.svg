<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient: Deep Warm Espresso to Dark Chocolate -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1910" />
      <stop offset="100%" stop-color="#140A05" />
    </linearGradient>
    
    <!-- Premium Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B87333" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#FFF8DC" />
    </linearGradient>

    <!-- Subtle Drop Shadow for elements inside -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Ring (Gold Border) -->
  <circle cx="50" cy="50" r="46" fill="url(#logoBg)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#shadow)" />
  
  <!-- Inner Ring (Dashed Gold) -->
  <circle cx="50" cy="50" r="40" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3 3" opacity="0.5" />

  <!-- Center Graphic: Elegant Stylized Croissant & Wheat -->
  <g filter="url(#shadow)">
    <!-- Stylized Wheat Stalk -->
    <!-- Stem -->
    <path d="M54 75 C54 65, 54 45, 54 25" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Left Wheat Grains -->
    <path d="M54 60 C50 58, 48 53, 52 49 C54 51, 54 56, 54 56 Z" fill="url(#goldGrad)" />
    <path d="M54 50 C50 48, 48 43, 52 39 C54 41, 54 46, 54 46 Z" fill="url(#goldGrad)" />
    <path d="M54 40 C50 38, 48 33, 52 29 C54 31, 54 36, 54 36 Z" fill="url(#goldGrad)" />
    <path d="M54 30 C50 28, 48 23, 52 19 C54 21, 54 26, 54 26 Z" fill="url(#goldGrad)" />

    <!-- Right Wheat Grains -->
    <path d="M54 65 C58 63, 60 58, 56 54 C54 56, 54 61, 54 61 Z" fill="url(#goldGrad)" />
    <path d="M54 55 C58 53, 60 48, 56 44 C54 46, 54 51, 54 51 Z" fill="url(#goldGrad)" />
    <path d="M54 45 C58 43, 60 38, 56 34 C54 36, 54 41, 54 41 Z" fill="url(#goldGrad)" />
    <path d="M54 35 C58 33, 60 28, 56 24 C54 26, 54 31, 54 31 Z" fill="url(#goldGrad)" />

    <!-- Top Grain -->
    <path d="M54 23 C54 18, 52 15, 52 15 C52 15, 50 18, 50 23 C50 26, 52 28, 54 23 Z" fill="url(#goldGrad)" />

    <!-- Left Side: Stylized Croissant Crescent -->
    <!-- Curved overlapping segments -->
    <path d="M46 25 C28 30 24 50 32 66 C36 74 44 75 44 75 C40 68 34 58 36 46 C38 36 46 25 46 25 Z" fill="url(#goldGrad)" />
    <path d="M48 32 C34 36 30 50 36 62 C40 68 47 68 47 68 C44 62 39 54 41 44 C43 36 48 32 48 32 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M50 39 C40 42 36 50 40 58 C43 62 49 62 49 62 C47 57 43 51 45 44 C47 38 50 39 50 39 Z" fill="url(#goldGrad)" opacity="0.7" />
  </g>
</svg>
