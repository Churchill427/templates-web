<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient: Deep Warm Espresso to Dark Chocolate -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1910" />
      <stop offset="100%" stop-color="#140A05" />
    </linearGradient>
    
    <!-- Premium Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B87333" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#FFF8DC" />
    </linearGradient>

    <!-- Subtle Drop Shadow for elements inside -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Ring (Gold Border) -->
  <circle cx="50" cy="50" r="45" fill="url(#logoBg)" stroke="url(#goldGrad)" stroke-width="2" filter="url(#shadow)" />
  
  <!-- Inner Ring (Dashed Gold) -->
  <circle cx="50" cy="50" r="41" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2.5 2.5" opacity="0.4" />

  <!-- Center Graphic: Modern Stylized Wheat & Croissant -->
  <g filter="url(#shadow)">
    <!-- Elegant Straight Wheat Stalk Stem -->
    <path d="M50 72 L50 28" stroke="url(#goldGrad)" stroke-width="1.25" stroke-linecap="round" />
    
    <!-- Symmetrical Wheat Grains -->
    <!-- Top Terminal Grain -->
    <path d="M50 26 C49.2 23, 49.2 20, 50 17 C50.8 20, 50.8 23, 50 26 Z" fill="url(#goldGrad)" />
    
    <!-- Left Wheat Grains -->
    <path d="M50 32 C47.5 30.5, 45.5 27, 47.5 24 C49.5 26, 50 29.5, 50 32 Z" fill="url(#goldGrad)" />
    <path d="M50 41 C47 39, 44.5 35, 47 31 C49.5 33, 50 38, 50 41 Z" fill="url(#goldGrad)" />
    <path d="M50 50 C46.5 47.5, 43.5 43, 46.5 38 C49.5 40, 50 46.5, 50 50 Z" fill="url(#goldGrad)" />
    <path d="M50 59 C46 56, 42.5 51, 46 45 C49.5 47, 50 55, 50 59 Z" fill="url(#goldGrad)" />

    <!-- Right Wheat Grains -->
    <path d="M50 32 C52.5 30.5, 54.5 27, 52.5 24 C50.5 26, 50 29.5, 50 32 Z" fill="url(#goldGrad)" />
    <path d="M50 41 C53 39, 55.5 35, 53 31 C50.5 33, 50 38, 50 41 Z" fill="url(#goldGrad)" />
    <path d="M50 50 C53.5 47.5, 56.5 43, 53.5 38 C50.5 40, 50 46.5, 50 50 Z" fill="url(#goldGrad)" />
    <path d="M50 59 C54 56, 57.5 51, 54 45 C50.5 47, 50 55, 50 59 Z" fill="url(#goldGrad)" />

    <!-- Left Side: Concentric Croissant Crescents -->
    <!-- Outermost Layer -->
    <path d="M46 23 C26 28, 22 52, 42 74 C34 65, 33 50, 33 45 C33 38, 46 23, 46 23 Z" fill="url(#goldGrad)" />
    
    <!-- Middle Layer -->
    <path d="M47.5 30 C32 35, 29 50, 44 67 C38 60, 37 48, 37 44 C37 38, 47.5 30, 47.5 30 Z" fill="url(#goldGrad)" opacity="0.85" />
    
    <!-- Innermost Layer -->
    <path d="M49 37 C38 41, 36 50, 46 60 C42 55, 41 48, 41 45 C41 42, 49 37, 49 37 Z" fill="url(#goldGrad)" opacity="0.75" />
  </g>
</svg>
