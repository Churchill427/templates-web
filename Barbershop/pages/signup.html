<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — SHARP Barbershop</title>
  <meta name="description" content="Create your SHARP account for easy booking, appointment history, loyalty rewards, and exclusive member deals.">
  <link rel="icon" type="image/svg+xml" href="../assets/images/icons/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <!-- Background Image -->
    <div class="auth-bg">
      <img src="../assets/images/heroes/signup-bg.png" alt="" aria-hidden="true">
      <div class="auth-bg__overlay"></div>
    </div>

    <!-- Signup Card -->
    <div class="auth-card" id="signup-card">
      <a href="index.html" class="auth-card__logo" aria-label="SHARP - Go to homepage">
        <img src="../assets/images/icons/logo.svg" alt="SHARP Logo" width="64" height="64">
      </a>

      <h1 class="auth-card__title">Create Account</h1>
      <p class="auth-card__subtitle">Join SHARP for exclusive benefits</p>

      <form data-validate id="signup-form" aria-label="Signup form" class="auth-form">
        <div class="grid grid-2" style="gap: var(--space-md);">
          <div class="form__group">
            <label class="form__label" for="signup-first">First Name <span class="required">*</span></label>
            <input type="text" class="form__input" id="signup-first" placeholder="John" required>
            <span class="form__error"></span>
          </div>
          <div class="form__group">
            <label class="form__label" for="signup-last">Last Name <span class="required">*</span></label>
            <input type="text" class="form__input" id="signup-last" placeholder="Doe" required>
            <span class="form__error"></span>
          </div>
        </div>
        <div class="form__group">
          <label class="form__label" for="signup-email">Email <span class="required">*</span></label>
          <input type="email" class="form__input" id="signup-email" placeholder="john@example.com" required>
          <span class="form__error"></span>
        </div>
        <div class="form__group">
          <label class="form__label" for="signup-phone">Phone <span class="required">*</span></label>
          <input type="tel" class="form__input" id="signup-phone" placeholder="+1 (555) 000-0000" required>
          <span class="form__error"></span>
        </div>
        <div class="form__group">
          <label class="form__label" for="signup-password">Password <span class="required">*</span></label>
          <div class="form__input-wrapper">
            <input type="password" class="form__input" id="signup-password" placeholder="Create a password" required minlength="8">
            <button type="button" class="form__toggle-password" aria-label="Toggle password visibility" tabindex="-1">
              <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" style="display:none" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <span class="form__error"></span>
          <!-- Password Strength -->
          <div class="password-strength" id="password-strength">
            <div class="password-strength__bar"><div class="password-strength__fill" id="strength-fill"></div></div>
            <span class="password-strength__label" id="strength-label">8+ characters required</span>
          </div>
        </div>
        <div class="form__group">
          <label class="form__label" for="signup-confirm">Confirm Password <span class="required">*</span></label>
          <div class="form__input-wrapper">
            <input type="password" class="form__input" id="signup-confirm" placeholder="Confirm your password" required minlength="8">
            <button type="button" class="form__toggle-password" aria-label="Toggle password visibility" tabindex="-1">
              <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-closed" style="display:none" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <span class="form__error"></span>
        </div>
        <div class="auth-form__options">
          <label class="auth-form__remember">
            <input type="checkbox" id="agree-terms" required> I agree to the <a href="#" style="color: var(--accent-primary);">Terms of Service</a>
          </label>
        </div>
        <button type="submit" class="btn btn--primary btn--full btn--lg" id="signup-submit">Create Account</button>
      </form>

      <!-- Divider -->
      <div class="auth-divider"><span>or sign up with</span></div>

      <!-- Social Logins -->
      <div class="auth-social">
        <button class="btn btn--social btn--google" id="signup-google">
          <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google
        </button>
        <button class="btn btn--social btn--apple" id="signup-apple">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
          Apple
        </button>
        <button class="btn btn--social btn--facebook" id="signup-facebook">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
          Facebook
        </button>
      </div>

      <p class="auth-card__switch">
        Already have an account? <a href="login.html" id="goto-login">Sign in</a>
      </p>
    </div>
  </div>

  <script src="../assets/js/main.js"></script>
  <script>
    // Password toggle
    document.querySelectorAll('.form__toggle-password').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var input = this.parentElement.querySelector('input');
        var open = this.querySelector('.eye-open');
        var closed = this.querySelector('.eye-closed');
        if (input.type === 'password') { input.type = 'text'; open.style.display = 'none'; closed.style.display = 'block'; }
        else { input.type = 'password'; open.style.display = 'block'; closed.style.display = 'none'; }
      });
    });
    // Password strength
    (function() {
      var pw = document.getElementById('signup-password');
      var fill = document.getElementById('strength-fill');
      var label = document.getElementById('strength-label');
      if (pw) pw.addEventListener('input', function() {
        var val = this.value, score = 0;
        if (val.length >= 8) score++;
        if (val.length >= 12) score++;
        if (/[a-z]/.test(val) && /[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^a-zA-Z0-9]/.test(val)) score++;
        var pct = Math.min(score * 20, 100);
        var color = pct <= 20 ? 'var(--color-error)' : pct <= 40 ? '#f97316' : pct <= 60 ? '#eab308' : pct <= 80 ? '#22c55e' : 'var(--color-success)';
        var text = pct <= 20 ? 'Very weak' : pct <= 40 ? 'Weak' : pct <= 60 ? 'Fair' : pct <= 80 ? 'Strong' : 'Very strong';
        fill.style.width = pct + '%'; fill.style.backgroundColor = color; label.textContent = text; label.style.color = color;
      });
    })();
  </script>
</body>
</html>
