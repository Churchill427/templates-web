<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — SHARP Barbershop</title>
  <meta name="description" content="Something exciting is coming. Stay tuned for SHARP's latest addition to premium men's grooming.">
  <link rel="icon" type="image/svg+xml" href="../assets/images/icons/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body class="utility-page">
  <div class="utility-container">
    <div class="utility-bg">
      <img src="../assets/images/heroes/hero-coming-soon.png" alt="" aria-hidden="true">
      <div class="utility-bg__overlay"></div>
    </div>
    <div class="utility-content">
      <a href="index.html" class="utility-content__logo" aria-label="SHARP - Go to homepage">
        <img src="../assets/images/icons/logo.svg" alt="SHARP Logo" width="56" height="56">
      </a>
      <h1 class="utility-content__title" style="font-size: clamp(2rem, 5vw, 3.5rem);">SOMETHING SHARP IS COMING</h1>
      <p class="utility-content__text" style="max-width: 500px;">We're crafting something new. Subscribe to be the first to know when we launch.</p>

      <!-- Countdown Timer -->
      <div class="countdown" id="countdown-timer">
        <div class="countdown__item">
          <span class="countdown__value" id="countdown-days">30</span>
          <span class="countdown__label">Days</span>
        </div>
        <div class="countdown__item">
          <span class="countdown__value" id="countdown-hours">12</span>
          <span class="countdown__label">Hours</span>
        </div>
        <div class="countdown__item">
          <span class="countdown__value" id="countdown-minutes">45</span>
          <span class="countdown__label">Minutes</span>
        </div>
        <div class="countdown__item">
          <span class="countdown__value" id="countdown-seconds">00</span>
          <span class="countdown__label">Seconds</span>
        </div>
      </div>

      <!-- Newsletter -->
      <form class="newsletter" data-validate aria-label="Coming soon notification form" id="coming-soon-form" style="max-width: 480px;">
        <div class="form__group" style="flex: 1; margin-bottom: 0;">
          <input type="email" class="form__input newsletter__input" placeholder="Enter your email" required aria-label="Email address" id="coming-soon-email" style="background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); color: white;">
          <span class="form__error"></span>
        </div>
        <button type="submit" class="btn btn--primary" id="coming-soon-submit">Notify Me</button>
      </form>

      <!-- Social -->
      <div class="utility-content__social">
        <a href="#" aria-label="Instagram" style="color: rgba(245,240,232,0.7); transition: color 0.3s;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/></svg></a>
        <a href="#" aria-label="Facebook" style="color: rgba(245,240,232,0.7); transition: color 0.3s;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></a>
        <a href="#" aria-label="X" style="color: rgba(245,240,232,0.7); transition: color 0.3s;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l11.733 16h4.267l-11.733 -16h-4.267z"/><path d="M4 20l6.768 -6.768m2.46 -2.46l6.772 -6.772"/></svg></a>
      </div>

      <a href="index.html" class="utility-content__back-link">Back to homepage</a>
    </div>
  </div>

  <script>
    // Countdown Timer - set to 30 days from now
    (function() {
      var target = new Date();
      target.setDate(target.getDate() + 30);
      function update() {
        var now = new Date(), diff = target - now;
        if (diff <= 0) return;
        var d = Math.floor(diff / 86400000);
        var h = Math.floor((diff % 86400000) / 3600000);
        var m = Math.floor((diff % 3600000) / 60000);
        var s = Math.floor((diff % 60000) / 1000);
        document.getElementById('countdown-days').textContent = String(d).padStart(2, '0');
        document.getElementById('countdown-hours').textContent = String(h).padStart(2, '0');
        document.getElementById('countdown-minutes').textContent = String(m).padStart(2, '0');
        document.getElementById('countdown-seconds').textContent = String(s).padStart(2, '0');
      }
      update();
      setInterval(update, 1000);
    })();
  </script>
</body>
</html>
