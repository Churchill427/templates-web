<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUTT — 404 Page Not Found</title>
  <meta name="description" content="Oops! Looks like your shot sliced off course. Let us guide you back to the fairway at PUTT.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230B6E4F'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23FFC53D'/%3E%3Crect x='15' y='4' width='3' height='14' rx='1.5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body class="error-page">

  <!-- Top-corner controls -->
  <div class="error-toggles">
    <button class="theme-toggle" aria-label="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></g></svg>
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/></svg>
    </button>
    <button class="rtl-toggle" aria-label="Toggle text direction">RTL</button>
  </div>

  <div class="error-content">
    <a href="../index.html" class="nav-logo" style="justify-content:center;margin-bottom:1.5rem;" aria-label="PUTT Home">
      <svg viewBox="0 0 36 36" fill="none" style="width:40px;height:40px;">
        <circle cx="18" cy="18" r="16" fill="#0B6E4F"/>
        <circle cx="18" cy="18" r="5.5" fill="#FFC53D"/>
        <rect x="16.5" y="4" width="3" height="15" rx="1.5" fill="white"/>
      </svg>
      <span class="nav-logo-text" style="font-size:2rem;">PUTT</span>
    </a>

    <!-- Animated Golf Ball rolling towards cup -->
    <div class="error-animation">
      <svg viewBox="0 0 300 120" style="width:100%;max-width:320px;height:auto;">
        <!-- Putting Green Turf Surface -->
        <path d="M10 95 Q150 90 290 95" stroke="#0B6E4F" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- Hole Cup -->
        <ellipse cx="230" cy="95" rx="18" ry="6" fill="#12181F"/>
        <!-- Flagstick and Pennant -->
        <line x1="230" y1="95" x2="230" y2="25" stroke="#22272E" stroke-width="3"/>
        <polygon points="230,25 270,37 230,50" fill="#FF6B5B"/>
        <!-- Rolling Ball with keyframe animation -->
        <g class="error-ball">
          <circle cx="120" cy="90" r="10" fill="#FAF7F2" stroke="#22272E" stroke-width="1.5"/>
          <circle cx="118" cy="88" r="1.5" fill="#CCCCCC"/>
          <circle cx="122" cy="88" r="1.5" fill="#CCCCCC"/>
          <circle cx="120" cy="92" r="1.5" fill="#CCCCCC"/>
        </g>
      </svg>
    </div>

    <h1>404</h1>
    <h2>Ball Off Course!</h2>
    <p>Looks like your shot hooked into the rough. The page you are looking for has been moved, renamed, or never existed on the scorecard.</p>

    <div class="error-search">
      <input type="text" class="form-input" placeholder="Search attractions, pricing..." aria-label="Search site">
      <a href="attractions.html" class="btn btn-secondary">Search</a>
    </div>

    <div class="error-links">
      <a href="../index.html" class="btn btn-primary">Return to Green</a>
      <a href="attractions.html" class="btn btn-outline">Explore Attractions</a>
    </div>
  </div>

  <script src="../assets/js/global.js"></script>
</body>
</html>
