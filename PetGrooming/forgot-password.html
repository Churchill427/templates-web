<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pawly — Recover Password</title>
  <meta name="description" content="Reset your Pawly portal password easily.">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    /* Prevent vertical scroll on auth screens */
    html, body {
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    .auth-layout {
      display: flex;
      height: 100vh;
      width: 100vw;
      background: var(--color-bg-surface);
      align-items: center;
      justify-content: center;
      padding: var(--space-xl);
      position: relative;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      animation: scaleIn 0.5s ease-out forwards;
    }
  </style>
</head>
<body class="page-transition">
  <a href="#auth-card-element" class="skip-link">Skip to password recovery form</a>

  <div class="auth-layout">
    <!-- Floating Theme and LTR/RTL Toggles -->
    <div class="auth-theme-toggles">
      <button class="rtl-toggle-btn rtl-toggle" aria-label="Toggle text direction">LTR</button>
      <button class="navbar-toggle-btn theme-toggle" aria-label="Toggle dark mode">
        <i class="ph ph-sun icon-sun" style="display:none;"></i>
        <i class="ph ph-moon icon-moon"></i>
      </button>
    </div>
    <div class="card auth-card" id="auth-card-element" style="border:none; box-shadow:var(--shadow-xl); padding: var(--space-xl);">
      <div style="text-align:center; margin-bottom:var(--space-md);">
        <a href="index.html" style="display:inline-block; margin-bottom: var(--space-xs);">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:36px; height:36px;">
            <circle cx="14" cy="10" r="5" fill="var(--color-primary)"/>
            <circle cx="34" cy="10" r="5" fill="var(--color-primary)"/>
            <circle cx="7" cy="24" r="5" fill="var(--color-primary)"/>
            <circle cx="41" cy="24" r="5" fill="var(--color-primary)"/>
            <ellipse cx="24" cy="32" rx="12" ry="10" fill="var(--color-primary)"/>
          </svg>
        </a>
        <h2 style="font-size:24px; margin-bottom:4px;">Recover Password</h2>
        <p style="color:var(--color-text-muted); font-size:var(--fs-small); margin-bottom:0;">We'll send recovery links to your registered inbox</p>
      </div>

      <form id="recover-auth-form" data-validate>
        <div class="form-group">
          <label class="form-label" for="recover-email">Email Address</label>
          <div class="form-input-icon">
            <i class="ph ph-envelope"></i>
            <input type="email" id="recover-email" class="form-input" placeholder="name@domain.com" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" style="margin-bottom:var(--space-md);">Send Recovery Link</button>

        <p style="text-align:center; font-size:13px; color:var(--color-text-muted); margin-bottom:0;">
          Remembered password? <a href="login.html" style="font-weight:var(--fw-semibold);">Back to login</a>
        </p>
      </form>
    </div>
  </div>

  <script src="assets/js/theme-toggle.js"></script>
  <script src="assets/js/rtl-toggle.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/forms.js"></script>

  <!-- simulated recovery form handler -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const recoveryForm = document.getElementById('recover-auth-form');
      if (!recoveryForm) return;

      recoveryForm.addEventListener('submit', (e) => {
        e.preventDefault();
        // showToast is loaded inside main.js
        if (typeof showToast === 'function') {
          showToast('Reset email has been dispatched successfully!', 'success');
        }
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 3000);
      });
    });
  </script>
</body>
</html>
