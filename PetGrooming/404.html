<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pawly — Page Not Found</title>
  <meta name="description" content="Oops! The page you are looking for has run away.">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    .notfound-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      align-items: center;
      justify-content: center;
      background: var(--color-bg-surface);
      padding: var(--space-xl);
      text-align: center;
    }
    .notfound-container {
      max-width: 480px;
    }
  </style>
</head>
<body class="page-transition">
  <a href="index.html" class="skip-link">Skip to home page</a>

  <div class="notfound-layout">
    <div class="notfound-container anim-scale-in">
      <div style="font-size:120px; font-weight:var(--fw-bold); font-family:var(--font-heading); color:var(--color-primary); line-height:1; margin-bottom:var(--space-md); display:flex; align-items:center; justify-content:center; gap:var(--space-xs);">
        4<i class="ph ph-paw-print" style="font-size:80px; transform:rotate(-15deg); color:var(--color-secondary);"></i>4
      </div>
      <h1 style="font-size:28px; margin-bottom:var(--space-sm);">Oops! This page has run away</h1>
      <p style="color:var(--color-text-secondary); margin-bottom:var(--space-xl); line-height:1.6;">
        We searched high and low, but the page you are looking for isn't here. It might have chased a squirrel or gone out for a walk.
      </p>
      
      <div style="display:flex; gap:var(--space-sm); justify-content:center; flex-wrap:wrap;">
        <a href="index.html" class="btn btn-primary"><i class="ph ph-house"></i> Go to Homepage</a>
        <a href="contact.html" class="btn btn-outline"><i class="ph ph-phone"></i> Contact Support</a>
      </div>
    </div>
  </div>

  <script src="assets/js/theme-toggle.js"></script>
  <script src="assets/js/rtl-toggle.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
