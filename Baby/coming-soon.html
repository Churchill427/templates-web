<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TINY - Something TINY is Coming</title>
  <meta name="description" content="Stay tuned! Something TINY is launching soon. Check out our countdown timer and subscribe to receive launch notification discounts.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF6B6B'><path d='M4.5 8.5a2.5 2.5 0 1 1 3.22-2.38 5.48 5.48 0 0 1 8.56 0 2.5 2.5 0 1 1 3.22 2.38 5.5 5.5 0 0 1 .5 3.12c0 2.45-1.6 4.5-3.8 5.16.2.46.3.97.3 1.5a3 3 0 0 1-6 0c0-.53.1-1.04.3-1.5-2.2-.66-3.8-2.71-3.8-5.16 0-1.12.18-2.18.5-3.12z'/></svg>">
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  
  <!-- JS Libraries -->
  <script src="assets/js/main.js" defer></script>
  <script src="assets/js/cart.js" defer></script>
  <script src="assets/js/animations.js" defer></script>
  
  <style>
    /* Coming Soon full-screen design */
    body.coming-soon-body {
      background: linear-gradient(135deg, #FFF5E1, #FFF);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: var(--space-4) var(--space-3);
    }
    
    body.dark-theme.coming-soon-body {
      background: linear-gradient(135deg, #1A1A2E, #22223B);
    }
    
    .coming-soon-container {
      max-width: 700px;
      width: 100%;
      text-align: center;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      box-shadow: var(--shadow-lg);
    }
    
    /* Countdown clocks layout */
    .countdown-grid {
      display: flex;
      justify-content: center;
      gap: var(--space-2);
      margin: var(--space-4) 0;
    }
    
    .countdown-card {
      background-color: var(--accent-color);
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: var(--radius-md);
      min-width: 80px;
      text-align: center;
    }

    body.dark-theme .countdown-card {
      background-color: #2D2D44;
    }
    
    .countdown-val {
      font-size: 2.25rem;
      font-weight: 800;
      font-family: monospace;
      color: var(--primary-color);
      line-height: 1.1;
    }
    
    .countdown-lbl {
      font-size: 0.8rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    
    /* Blur preview */
    .blur-teaser-box {
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      margin: var(--space-4) auto var(--space-2) auto;
      max-width: 450px;
      height: 200px;
    }
    
    .blur-teaser-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(15px);
      transform: scale(1.05);
    }
    
    .teaser-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-family: var(--font-headings);
      font-weight: 700;
      font-size: 1.25rem;
      padding: var(--space-2);
    }
  </style>
</head>
<body class="coming-soon-body">

  <!-- Main Container -->
  <div class="coming-soon-container reveal">
    
    <!-- Section 1: Hero Section -->
    <header style="margin-bottom: var(--space-3);">
      <span style="font-size: 0.85rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--primary-color);">Pre-Launch Teaser</span>
      <h1 style="margin-top: 8px;">Something TINY is Coming</h1>
    </header>

    <!-- Section 2: Countdown Timer -->
    <section style="padding: 0;">
      <div class="countdown-grid" id="coming-soon-timer">
        <div class="countdown-card">
          <div class="countdown-val" id="days-val">00</div>
          <div class="countdown-lbl">Days</div>
        </div>
        <div class="countdown-card">
          <div class="countdown-val" id="hours-val">00</div>
          <div class="countdown-lbl">Hrs</div>
        </div>
        <div class="countdown-card">
          <div class="countdown-val" id="minutes-val">00</div>
          <div class="countdown-lbl">Mins</div>
        </div>
        <div class="countdown-card">
          <div class="countdown-val" id="seconds-val">00</div>
          <div class="countdown-lbl">Secs</div>
        </div>
      </div>
    </section>

    <!-- Section 3: Notify Me Form -->
    <section style="padding: 0; max-width: 500px; margin: 0 auto;">
      <p style="color: var(--text-secondary); margin-bottom: var(--space-2);">Subscribe to receive 15% off at launch and secure VIP shopping priority access.</p>
      
      <div id="notify-form-wrapper">
        <form onsubmit="event.preventDefault(); document.getElementById('notify-form-wrapper').innerHTML = '<h3 style=\'color: var(--secondary-color);\' class=\'form-success-animation\'><i class=\'fa-solid fa-envelope-circle-check\'></i> Spot reserved! Check mail.</h3>';" style="display:flex; gap:8px;">
          <input type="email" placeholder="Your Email Address" required class="form-control" style="border-radius: var(--radius-sm);">
          <button type="submit" class="btn btn-primary" style="border-radius: var(--radius-sm); white-space: nowrap;">Notify Me</button>
        </form>
      </div>
    </section>

    <!-- Section 4: Preview Teaser -->
    <section style="padding: 0;">
      <div class="blur-teaser-box">
        <img src="https://images.unsplash.com/photo-1503919545889-aef636e10ad4?auto=format&fit=crop&w=600&q=80" alt="Blurred preview of upcoming apparel line">
        <div class="teaser-overlay">
          <span>Autumn Knitwear Collection Preview</span>
        </div>
      </div>
    </section>

    <!-- Section 5: Social Connections -->
    <section style="padding: var(--space-2) 0;">
      <p style="font-size:0.85rem; color:var(--text-secondary); margin-bottom: 8px;">Connect with us on official channels</p>
      <div style="display: flex; justify-content: center; gap: 8px;">
        <a href="#" class="social-btn google" style="width:34px; height:34px; font-size:0.85rem;"><i class="fa-brands fa-google"></i></a>
        <a href="#" class="social-btn facebook" style="width:34px; height:34px; font-size:0.85rem;"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#" class="social-btn apple" style="width:34px; height:34px; font-size:0.85rem;"><i class="fa-brands fa-apple"></i></a>
        <a href="#" class="social-btn instagram" style="width:34px; height:34px; font-size:0.85rem;"><i class="fa-brands fa-instagram"></i></a>
      </div>
    </section>

    <!-- Section 6: Back to Home (Clickable Logo) -->
    <footer style="margin-top: var(--space-3); border-top: 1px solid var(--border-color); padding-top: 15px; display: flex; justify-content: space-between; align-items: center;">
      <!-- LTR/RTL and Theme togglers on Coming soon page as well -->
      <div style="display: flex; gap: 6px;">
        <button class="toggle-btn rtl-toggle-btn" style="padding: 4px 8px; font-size: 0.75rem;">LTR</button>
        <button class="toggle-btn theme-toggle-btn" style="padding: 4px 8px; font-size: 0.75rem;"><i class="fa-solid fa-moon"></i></button>
      </div>
      <a href="index.html" class="logo" style="text-decoration: none; font-size: 1.5rem;">
        <span class="logo-text">TINY</span>
      </a>
    </footer>

  </div>

</body>
</html>
